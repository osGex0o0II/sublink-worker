name: Test Worker

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Verify build, tests, audit, and dependency freshness
        run: npm run verify
